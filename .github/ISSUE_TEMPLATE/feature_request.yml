name: Feature request
description: An idea for a new widget, setting or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please don't include personal data (real names, emails, your notes or photos) in the request.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you'd use it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What problem does it solve?
      description: What you do today without it, or what gets in the way.
  - type: input
    id: version
    attributes:
      label: Chisel version (optional)
      placeholder: "1.0.0"
